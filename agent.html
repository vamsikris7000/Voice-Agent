<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Xpectrum Voice Test</title>
</head>
<body>
  <h2 style="color: #2c3e50; margin-bottom: 30px;">🎙️ Voice Agent Test</h2>
  <button id="connectBtn" style="background: #3498db; color: white; border: none; padding: 12px 24px; border-radius: 6px; font-size: 16px; cursor: pointer; margin-bottom: 20px;">Connect to Agent</button>
  <p id="status" style="color: #7f8c8d; font-weight: 500;">Status: Not connected</p>
  <div id="audioControls" style="display: none; background: #e8f5e8; border: 1px solid #27ae60; border-radius: 8px; padding: 15px; margin: 20px 0;">
    <p style="margin: 5px 0; color: #27ae60;">🎤 Your microphone is active</p>
    <p style="margin: 5px 0; color: #27ae60;">🔊 Agent audio is playing</p>
    <p style="margin: 5px 0; color: #27ae60;">💬 AI conversation active</p>
  </div>
  <div id="conversationLog" style="display: none; margin: 20px 0; padding: 15px; border: 1px solid #e0e0e0; border-radius: 8px; max-height: 200px; overflow-y: auto; background: #f8f9fa;">
    <h4 style="margin: 0 0 15px 0; color: #495057;">💬 Conversation Log</h4>
    <div id="conversationContent"></div>
  </div>


  <!-- LiveKit SDK -->
  <script src="https://cdn.jsdelivr.net/npm/livekit-client@latest/dist/livekit-client.umd.min.js"></script>
  <script>
    // Debug: Check what's available
    console.log('Window object keys:', Object.keys(window).filter(key => key.toLowerCase().includes('livekit')));
    console.log('Livekit:', typeof Livekit);
    console.log('window.Livekit:', typeof window.Livekit);
    console.log('LivekitClient:', typeof LivekitClient);
    console.log('window.LivekitClient:', typeof window.LivekitClient);
    
    // Use LivekitClient directly since that's what's available
    if (typeof LivekitClient !== 'undefined') {
      console.log('Found LiveKit global:', LivekitClient);
      console.log('Available methods:', Object.getOwnPropertyNames(LivekitClient));
      console.log('LivekitClient.LocalTrack:', LivekitClient.LocalTrack);
      console.log('LivekitClient.LocalAudioTrack:', LivekitClient.LocalAudioTrack);
      window.Livekit = LivekitClient; // Make it available as Livekit for compatibility
    } else {
      console.error('LiveKit not found');
    }
  </script>

  <script>
    // Wait for LiveKit SDK to load
    const waitForLivekit = () => {
      return new Promise((resolve) => {
        if (window.Livekit && window.Livekit.Room) {
          resolve();
        } else {
          // Wait for DOM to be ready
          window.addEventListener('load', () => {
            if (window.Livekit && window.Livekit.Room) {
              resolve();
            } else {
              console.error('LiveKit still not available after page load');
            }
          });
        }
      });
    };

    const agentName = "pravina";
    const statusEl = document.getElementById("status");
    const audioControls = document.getElementById("audioControls");
    const conversationLog = document.getElementById("conversationLog");
    const conversationContent = document.getElementById("conversationContent");
    
    let localAudioTrack = null;
    let room = null;
    let conversationHistory = [];
    let isListening = false;
    
    // Speech recognition setup
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'en-US';
      
      recognition.onresult = async (event) => {
        const transcript = event.results[0][0].transcript;
        console.log('Speech recognized:', transcript);
        
        // Mark as not listening while processing
        isListening = false;
        
        // Add user message to conversation
        addToConversation('user', transcript);
        
        // Get AI response
        try {
          const response = await fetch('/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
              message: transcript, 
              conversationHistory: conversationHistory 
            })
          });
          
          if (response.ok) {
            const data = await response.json();
            conversationHistory = data.conversationHistory;
            
            // Add AI response to conversation
            addToConversation('assistant', data.response);
            
            // Speak the AI response
            speakResponse(data.response);
          }
        } catch (err) {
          console.error('Error getting AI response:', err);
          addToConversation('system', 'Error: Could not get AI response');
        }
        
        // Start listening again after a delay
        setTimeout(() => {
          startListening();
        }, 2000);
      };
      
      recognition.onerror = (event) => {
        console.error('Speech recognition error:', event.error);
        isListening = false;
        // Don't auto-restart on error, let user reconnect
      };
      
      recognition.onend = () => {
        isListening = false;
        // Don't auto-restart, let the onresult handler manage it
      };
    }
    
    // Function to add messages to conversation log
    function addToConversation(role, content) {
      const messageDiv = document.createElement('div');
      messageDiv.style.margin = '8px 0';
      messageDiv.style.padding = '10px 12px';
      messageDiv.style.borderRadius = '8px';
      messageDiv.style.fontSize = '14px';
      messageDiv.style.lineHeight = '1.4';
      
      if (role === 'user') {
        messageDiv.style.backgroundColor = '#e3f2fd';
        messageDiv.style.textAlign = 'right';
        messageDiv.style.border = '1px solid #bbdefb';
        messageDiv.innerHTML = `<strong style="color: #1976d2;">You:</strong> ${content}`;
      } else if (role === 'assistant') {
        messageDiv.style.backgroundColor = '#f3e5f5';
        messageDiv.style.border = '1px solid #e1bee7';
        messageDiv.innerHTML = `<strong style="color: #7b1fa2;">Pravina:</strong> ${content}`;
      } else {
        messageDiv.style.backgroundColor = '#fff3e0';
        messageDiv.style.border = '1px solid #ffcc80';
        messageDiv.innerHTML = `<strong style="color: #f57c00;">System:</strong> ${content}`;
      }
      
      conversationContent.appendChild(messageDiv);
      conversationContent.scrollTop = conversationContent.scrollHeight;
    }
    
    // Function to start listening for speech
    function startListening() {
      if (!recognition || isListening) return;
      
      try {
        recognition.start();
        isListening = true;
        console.log('Started listening for speech...');
      } catch (err) {
        console.error('Error starting speech recognition:', err);
        isListening = false;
      }
    }
    
    // Function to speak AI response using browser's speech synthesis
    function speakResponse(text) {
      if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 0.9;
        utterance.pitch = 1.0;
        utterance.volume = 1.0;
        
        // Try to use a female voice for Pravina
        const voices = speechSynthesis.getVoices();
        const femaleVoice = voices.find(voice => 
          voice.name.includes('female') || 
          voice.name.includes('Samantha') || 
          voice.name.includes('Victoria')
        );
        if (femaleVoice) {
          utterance.voice = femaleVoice;
        }
        
        speechSynthesis.speak(utterance);
      }
    }
    
    // Function to automatically enable microphone
    async function enableMicrophone() {
      try {
        if (!room) {
          console.log('Room not ready yet, will enable microphone after connection');
          return;
        }
        
        console.log('Automatically enabling microphone...');
        
        // Create local audio track directly using LiveKit's getUserMedia
        localAudioTrack = await Livekit.createLocalAudioTrack({
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true
        });
        
        // Publish to room
        await room.localParticipant.publishTrack(localAudioTrack);
        
        audioControls.style.display = "block";
        conversationLog.style.display = "block";
        console.log('Microphone automatically enabled and published to room');
        
        // Start listening for speech after a short delay
        setTimeout(() => {
          isListening = true;
          startListening();
          addToConversation('system', '🎤 Microphone active - start speaking!');
        }, 2000);
        
      } catch (err) {
        console.error('Error automatically enabling microphone:', err);
        statusEl.textContent = "Warning: Could not enable microphone automatically: " + err.message;
      }
    }



    document.getElementById("connectBtn").addEventListener("click", async () => {
      try {
        // Wait for LiveKit SDK to be ready
        await waitForLivekit();
        
        statusEl.textContent = "Fetching token...";

        // 1. Get token from API
        const res = await fetch("http://localhost:3000/generate-token", {
          method: "POST"
        });
        if (!res.ok) throw new Error("Failed to get token");
        const data = await res.json();

        const token = data.token;
        const livekitUrl = data.livekit_url;

        statusEl.textContent = "Connecting to LiveKit...";

        // 2. Connect to LiveKit
        room = new Livekit.Room();
        await room.connect(livekitUrl, token);

        statusEl.textContent = "Connected! Automatically enabling microphone...";

        // Automatically enable microphone after connection
        await enableMicrophone();

        // Enhanced track management for multiple audio tracks
        const audioTracks = new Map();
        const trackReconnectAttempts = new Map();
        
        // Enhanced track subscription with multiple track handling
        function handleTrackSubscribed(track, publication, participant) {
          console.log(`🎵 Audio track subscribed: ${track.sid} from participant: ${participant.identity}`);
          
          if (track.kind === 'audio') {
            try {
              // Create MediaStream from track
              const mediaStream = new MediaStream([track.mediaStreamTrack]);
              
              // Create dedicated audio element for this track
              const audioElement = document.createElement('audio');
              audioElement.srcObject = mediaStream;
              audioElement.autoplay = true;
              audioElement.muted = false;
              audioElement.volume = 1.0;
              audioElement.style.display = 'none'; // Hide but keep functional
              
              // Set unique ID for this track
              const trackId = track.sid;
              audioElement.setAttribute('data-track-id', trackId);
              audioElement.setAttribute('data-participant', participant.identity);
              
              // Store audio element reference
              audioTracks.set(trackId, audioElement);
              
              // Add to DOM
              document.body.appendChild(audioElement);
              

              
              // Play with error handling
              audioElement.play().then(() => {
                console.log(`✅ Audio playing successfully for track: ${trackId}`);
                statusEl.textContent = `Playing audio from ${participant.identity}`;
                audioControls.style.display = "block";
              }).catch((error) => {
                console.error(`❌ Error playing audio for track ${trackId}:`, error);
                // Attempt to reconnect this specific track
                setTimeout(() => reconnectTrack(track, publication, participant), 1000);
              });
              
              // Monitor track state changes
              track.on('muted', () => {
                console.log(`🔇 Track ${trackId} muted`);
              });
              
              track.on('unmuted', () => {
                console.log(`🔊 Track ${trackId} unmuted`);
              });
              
              track.on('ended', () => {
                console.log(`⏹️ Track ${trackId} ended`);
                handleTrackEnded(trackId);
              });
              
              // Monitor audio element state
              audioElement.addEventListener('ended', () => {
                console.log(`⏹️ Audio element ended for track: ${trackId}`);
                handleTrackEnded(trackId);
              });
              
              audioElement.addEventListener('error', (error) => {
                console.error(`❌ Audio element error for track ${trackId}:`, error);
                handleTrackEnded(trackId);
              });
              
            } catch (error) {
              console.error(`❌ Error setting up audio for track ${track.sid}:`, error);
              // Attempt to reconnect this track
              setTimeout(() => reconnectTrack(track, publication, participant), 1000);
            }
          }
        }
        
        // Handle track unsubscription
        function handleTrackUnsubscribed(track, publication, participant) {
          console.log(`❌ Audio track unsubscribed: ${track.sid} from participant: ${participant.identity}`);
          
          const trackId = track.sid;
          
          // Remove from our tracking
          const audioElement = audioTracks.get(trackId);
          if (audioElement) {
            audioElement.remove();
            audioTracks.delete(trackId);
          }
          
          // Attempt to reconnect if this was an agent track
          if (participant.identity.startsWith('agent-')) {
            console.log(`🔄 Agent track lost - attempting reconnection for: ${trackId}`);
            setTimeout(() => reconnectTrack(track, publication, participant), 1000);
          }
        }
        
        // Handle track ended
        function handleTrackEnded(trackId) {
          console.log(`🔄 Track ended: ${trackId} - attempting recovery`);
          
          // Remove from tracking
          const audioElement = audioTracks.get(trackId);
          if (audioElement) {
            audioElement.remove();
            audioTracks.delete(trackId);
          }
          
          // Reset reconnect attempts for this track
          trackReconnectAttempts.delete(trackId);
        }
        
        // Reconnect specific track
        async function reconnectTrack(track, publication, participant) {
          const trackId = track.sid;
          const currentAttempts = trackReconnectAttempts.get(trackId) || 0;
          
          if (currentAttempts >= 3) {
            console.error(`❌ Max reconnection attempts reached for track: ${trackId}`);
            return;
          }
          
          console.log(`🔄 Attempting to reconnect track ${trackId} (attempt ${currentAttempts + 1}/3)`);
          trackReconnectAttempts.set(trackId, currentAttempts + 1);
          
          try {
            // Wait before reconnecting
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            // Check if track is still available
            if (track && track.mediaStreamTrack && track.mediaStreamTrack.readyState === 'live') {
              console.log(`✅ Track ${trackId} is still live - reattaching`);
              
              // Recreate audio element
              const mediaStream = new MediaStream([track.mediaStreamTrack]);
              const audioElement = document.createElement('audio');
              audioElement.srcObject = mediaStream;
              audioElement.autoplay = true;
              audioElement.muted = false;
              audioElement.volume = 1.0;
              audioElement.style.display = 'none';
              audioElement.setAttribute('data-track-id', trackId);
              audioElement.setAttribute('data-participant', participant.identity);
              
              // Store reference
              audioTracks.set(trackId, audioElement);
              
              // Add to DOM
              document.body.appendChild(audioElement);
              
              // Play
              await audioElement.play();
              console.log(`✅ Track ${trackId} reconnected successfully`);
              
              // Reset reconnect attempts
              trackReconnectAttempts.delete(trackId);
              
            } else {
              console.log(`⚠️ Track ${trackId} is no longer live - requesting new track`);
              // Request new track from agent
              await requestNewAudioTrack(participant.identity);
            }
            
          } catch (error) {
            console.error(`❌ Failed to reconnect track ${trackId}:`, error);
            // Try again after delay
            setTimeout(() => reconnectTrack(track, publication, participant), 2000);
          }
        }
        
        // Request new audio track from agent
        async function requestNewAudioTrack(participantId) {
          try {
            console.log(`🔄 Requesting new audio track from: ${participantId}`);
            
            // Call your backend to request a new audio track
            const response = await fetch('/request-audio-track', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                participant_id: participantId,
                room_name: room?.name,
                action: 'request_new_audio'
              })
            });
            
            if (response.ok) {
              console.log(`✅ New audio track requested from: ${participantId}`);
            } else {
              console.error(`❌ Failed to request new audio track: ${response.status}`);
            }
          } catch (error) {
            console.error(`❌ Error requesting new audio track:`, error);
          }
        }
        
        // Set up enhanced track event handlers
        room.on(Livekit.RoomEvent.TrackSubscribed, handleTrackSubscribed);
        room.on(Livekit.RoomEvent.TrackUnsubscribed, handleTrackUnsubscribed);

        // Handle track unsubscribed
        room.on(Livekit.RoomEvent.TrackUnsubscribed, (track, publication, participant) => {
          if (track.kind === "audio") {
            console.log('Audio track unsubscribed:', track.sid, 'from participant:', participant.identity);
            statusEl.textContent = `Audio track ended from ${participant.identity}`;
          }
        });

        // Handle room disconnection
        room.on(Livekit.RoomEvent.Disconnected, () => {
          statusEl.textContent = "Disconnected from agent";
          audioControls.style.display = "none";
          conversationLog.style.display = "none";
          isListening = false;
          
          // Clean up local audio track
          if (localAudioTrack) {
            localAudioTrack.stop();
            localAudioTrack = null;
          }
          
          // Clean up all remote audio tracks
          audioTracks.forEach((audioElement, trackId) => {
            audioElement.remove();
          });
          audioTracks.clear();
          trackReconnectAttempts.clear();
          
          // Stop health monitoring
          if (cleanupHealthMonitoring) {
            cleanupHealthMonitoring();
          }
          

        });

        // Handle connection quality changes
        room.on(Livekit.RoomEvent.ConnectionQualityChanged, (quality, participant) => {
          // If quality is poor, attempt to improve audio
          if (quality === 'poor' || quality === 'unknown') {
            optimizeAudioForPoorConnection();
          }
        });
        
        // Optimize audio for poor connection
        function optimizeAudioForPoorConnection() {
          // Reduce audio quality to improve connection
          audioTracks.forEach((audioElement, trackId) => {
            if (audioElement.srcObject instanceof MediaStream) {
              const tracks = audioElement.srcObject.getTracks();
              tracks.forEach(track => {
                if (track.kind === 'audio') {
                  // Apply audio constraints for poor connections
                  track.applyConstraints({
                    sampleRate: 8000, // Lower sample rate
                    channelCount: 1,  // Mono audio
                    echoCancellation: true,
                    noiseSuppression: true,
                    autoGainControl: true
                  }).catch(() => {
                    // Silent optimization attempt
                  });
                }
              });
            }
          });
        }
        
        // Audio health monitoring
        function setupAudioHealthMonitoring() {
          const checkAudioHealth = () => {
            audioTracks.forEach((audioElement, trackId) => {
              // Check if audio is actually playing
              if (audioElement.paused || audioElement.ended) {
                // Try to play silently
                audioElement.play().catch(() => {
                  // Silent recovery attempt
                });
              }
              
              // Check audio levels
              if (audioElement.volume === 0) {
                audioElement.volume = 1.0;
              }
            });
          };
          
          // Check every 3 seconds
          const healthInterval = setInterval(checkAudioHealth, 3000);
          
          return () => clearInterval(healthInterval);
        }
        
        // Start audio health monitoring
        const cleanupHealthMonitoring = setupAudioHealthMonitoring();





        // Handle participant joined (agent)
        room.on(Livekit.RoomEvent.ParticipantConnected, (participant) => {
          console.log('Participant joined:', participant.identity);
          statusEl.textContent = `Agent ${participant.identity} joined the room`;
        });



      } catch (err) {
        statusEl.textContent = "Error: " + err.message;
        console.error(err);
      }
    });
  </script>
</body>
</html>
